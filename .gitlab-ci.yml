stages:
  - sonar_scan
  - build
  - deploy
  - sonar_export

variables:
  IMAGE_NAME: "automed-dashboard-ui"
  DOCKER_API_VERSION: "1.41"

# Required CI/CD variables to enable Sonar export -> dashboard ingest:555
# - SONAR_HOST_URL          e.g. https://sonarqube.company.com
# - SONAR_TOKEN             Sonar user token
# - SONAR_PROJECT_KEY       Sonar project key
# - DASHBOARD_INGEST_URL    e.g. https://your-dashboard.com/api/sonar/ingest
# Optional:
# - SONAR_INCLUDE_BRANCH_PARAMS  set to "false" if branch params are unsupported
# - SONAR_BRANCH                 override branch name (otherwise CI_COMMIT_REF_NAME)
# - MAINPRODUCT                  dashboard main product name
# - SUBPRODUCT                   dashboard sub product name (used as MongoDB collection name)

sonar_scan:
  stage: sonar_scan
  image: sonarsource/sonar-scanner-cli:latest
  tags:
    - automedtest-dashboard
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      INCLUDE_BRANCH="${SONAR_INCLUDE_BRANCH_PARAMS:-true}"
      if [ "$INCLUDE_BRANCH" = "true" ]; then
        export BRANCH_NAME="${SONAR_BRANCH:-${CI_COMMIT_REF_NAME}}"
      else
        export BRANCH_NAME=""
      fi

      SCAN_ARGS="-Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.sources=src"
      if [ -n "$BRANCH_NAME" ]; then
        SCAN_ARGS="$SCAN_ARGS -Dsonar.branch.name=$BRANCH_NAME"
      fi

      sonar-scanner $SCAN_ARGS
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .scannerwork/report-task.txt
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  allow_failure: true

sonar_export_and_push:
  stage: sonar_export
  image: alpine:3.20
  tags:
    - automedtest-dashboard
  needs:
    - job: sonar_scan
      artifacts: true
  script:
    - apk add --no-cache curl jq

    - export SONAR_SERVER_URL="$(grep -E '^serverUrl=' .scannerwork/report-task.txt | cut -d= -f2-)"
    - export CE_TASK_ID="$(grep -E '^ceTaskId=' .scannerwork/report-task.txt | cut -d= -f2)"
    - export DASHBOARD_URL="$(grep -E '^dashboardUrl=' .scannerwork/report-task.txt | cut -d= -f2-)"

    - |
      INCLUDE_BRANCH="${SONAR_INCLUDE_BRANCH_PARAMS:-true}"
      if [ "$INCLUDE_BRANCH" = "true" ]; then
        export BRANCH_NAME="${SONAR_BRANCH:-${CI_COMMIT_REF_NAME}}"
      else
        export BRANCH_NAME=""
      fi

    - echo "SONAR_SERVER_URL=$SONAR_SERVER_URL"; echo "CE_TASK_ID=$CE_TASK_ID"; echo "BRANCH_NAME=$BRANCH_NAME"

    - |
      # Wait for Compute Engine task completion
      for i in $(seq 1 60); do
        STATUS="$(curl -s -u "$SONAR_TOKEN:" "$SONAR_SERVER_URL/api/ce/task?id=$CE_TASK_ID" | jq -r '.task.status')"
        echo "Sonar CE status: $STATUS"
        if [ "$STATUS" = "SUCCESS" ]; then break; fi
        if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then exit 1; fi
        sleep 5
      done

    - mkdir -p sonar-export

    - |
      QG_URL="$SONAR_SERVER_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY"
      if [ -n "$BRANCH_NAME" ]; then QG_URL="$QG_URL&branch=$BRANCH_NAME"; fi
      curl -s -u "$SONAR_TOKEN:" "$QG_URL" -o sonar-export/qualitygate.json

    - |
      MEASURES_URL="$SONAR_SERVER_URL/api/measures/component?component=$SONAR_PROJECT_KEY"
      if [ -n "$BRANCH_NAME" ]; then MEASURES_URL="$MEASURES_URL&branch=$BRANCH_NAME"; fi
      MEASURES_URL="$MEASURES_URL&metricKeys=reliability_issues,security_issues,maintainability_issues,bugs,vulnerabilities,code_smells,security_hotspots,accepted_issues,coverage,duplicated_lines_density,ncloc,reliability_rating,security_rating,sqale_rating,new_bugs,new_vulnerabilities,new_code_smells,new_security_hotspots,new_coverage,new_duplicated_lines_density,new_lines,new_issues,new_violations,new_accepted_issues"
      curl -s -u "$SONAR_TOKEN:" "$MEASURES_URL" -o sonar-export/measures.json

    - |
      NCP_URL="$SONAR_SERVER_URL/api/new_code_periods/show?project=$SONAR_PROJECT_KEY"
      if [ -n "$BRANCH_NAME" ]; then NCP_URL="$NCP_URL&branch=$BRANCH_NAME"; fi
      curl -s -u "$SONAR_TOKEN:" "$NCP_URL" -o sonar-export/new_code_period.json

    - |
      jq -n \
        --arg projectKey "$SONAR_PROJECT_KEY" \
        --arg branch "$BRANCH_NAME" \
        --arg mainproduct "${MAINPRODUCT:-}" \
        --arg subproduct "${SUBPRODUCT:-}" \
        --arg dashboardUrl "${DASHBOARD_URL:-}" \
        --arg scannedAt "$(date -Iseconds)" \
        --slurpfile qg sonar-export/qualitygate.json \
        --slurpfile measures sonar-export/measures.json \
        --slurpfile ncp sonar-export/new_code_period.json \
        '{
          projectKey: $projectKey,
          branch: (if ($branch|length) > 0 then $branch else null end),
          mainproduct: (if ($mainproduct|length) > 0 then $mainproduct else null end),
          subproduct: (if ($subproduct|length) > 0 then $subproduct else null end),
          scannedAt: $scannedAt,
          dashboardUrl: (if ($dashboardUrl|length) > 0 then $dashboardUrl else null end),
          qualityGate: ($qg[0].projectStatus // $qg[0]),
          measures: ($measures[0].component.measures // $measures[0].component // $measures[0]),
          newCodePeriod: ($ncp[0].newCodePeriod // $ncp[0]),
          metadata: {
            gitlab: {
              projectPath: env.CI_PROJECT_PATH,
              pipelineId: env.CI_PIPELINE_ID,
              jobId: env.CI_JOB_ID,
              commitSha: env.CI_COMMIT_SHA
            }
          }
        }' > sonar-export/payload.json

    - |
      echo "Posting to DASHBOARD_INGEST_URL=$DASHBOARD_INGEST_URL"
      curl -s -X POST "$DASHBOARD_INGEST_URL" \
        -H "Content-Type: application/json" \
        --data @sonar-export/payload.json

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .scannerwork/report-task.txt
      - sonar-export/*.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  allow_failure: true

build:
  stage: build
  image: docker:latest
  tags:
    - automedtest-dashboard
  script:
    - |
      if [ -n "$(docker images -q ${IMAGE_NAME}:latest)" ]; then
        echo "Tagging ${IMAGE_NAME}:latest as ${IMAGE_NAME}:previous"
        docker rmi --force "${IMAGE_NAME}:previous"
        docker tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}:previous"
        docker rmi --force "${IMAGE_NAME}:latest"
      else
        echo "No ${IMAGE_NAME}:latest found."
      fi
    - docker build -t "${IMAGE_NAME}:latest" .
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy:
  stage: deploy
  image: docker:latest
  tags:
    - automedtest-dashboard
  script:
    - echo "${IMAGE_NAME}"
    - if [ "$(docker ps -aq -f name=${IMAGE_NAME})" ]; then
      echo "Stopping and removing container ${IMAGE_NAME}...";
      docker stop "${IMAGE_NAME}" && docker rm "${IMAGE_NAME}";
      fi
    - >
      docker run
      --env NODE_ENV=production
      --env MONGODB_URI=$MONGODB_URI
      --env MONGODB_DB=$MONGODB_DB
      -v /etc/localtime:/etc/localtime:ro
      -p $EXPOSE_PORT:$PORT
      -d --name "${IMAGE_NAME}" "${IMAGE_NAME}:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
