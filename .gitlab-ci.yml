stages:
  - quality
  - quality_export
  # - build
  # - deploy

variables:
  IMAGE_NAME: "automed-dashboard-ui"
  DOCKER_API_VERSION: "1.41"

  # SonarJS uses a Node runtime internally; increase heap (MB) to avoid OOM.
  # If your runner has low memory, lower this value.
  SONAR_NODE_MAXSPACE: "6144"

# SonarQube -> Dashboard ingestion (set in GitLab CI/CD Variables)
# - SONAR_HOST_URL           e.g. https://sonarqube.company.com
# - SONAR_TOKEN              Sonar user token (masked/protected)
# - SONAR_PROJECT_KEY        Sonar project key
# - DASHBOARD_INGEST_URL     e.g. https://your-dashboard.com/api/addsonarqdata
# - SONAR_MAINPRODUCT        main product name to group results
# - SONAR_SUBPRODUCT         sub product name to group results
# Optional:
# - DASHBOARD_API_KEY        if set, addsonarqdata requires header x-api-key
# - SONAR_INCLUDE_BRANCH_PARAMS  set to "false" if your Sonar doesn't support branches
# - SONAR_BRANCH                 override branch name (default: CI_COMMIT_REF_NAME)

sonarqube_scan:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  tags:
    - automedtest-dashboard
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      INCLUDE_BRANCH="${SONAR_INCLUDE_BRANCH_PARAMS:-true}"
      if [ "$INCLUDE_BRANCH" = "true" ]; then
        BRANCH_NAME="${SONAR_BRANCH:-${CI_COMMIT_REF_NAME}}"
      else
        BRANCH_NAME=""
      fi

      # Scan only application source (prevents scanning large files under uploads/)
      EXTRA_PROPS="-Dsonar.sources=src -Dsonar.exclusions=**/node_modules/**,**/.next/**,uploads/**,public/**"
      EXTRA_PROPS="$EXTRA_PROPS -Dsonar.ws.timeout=120"
      EXTRA_PROPS="$EXTRA_PROPS -Dsonar.javascript.node.maxspace=$SONAR_NODE_MAXSPACE"

      SCAN_ARGS="-Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.projectKey=$SONAR_PROJECT_KEY"
      if [ -n "$BRANCH_NAME" ]; then
        SCAN_ARGS="$SCAN_ARGS -Dsonar.branch.name=$BRANCH_NAME"
      fi

      sonar-scanner $SCAN_ARGS $EXTRA_PROPS
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .scannerwork/report-task.txt
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

sonarqube_export_and_push:
  stage: quality_export
  image: alpine:3.20
  tags:
    - automedtest-dashboard
  dependencies:
    - sonarqube_scan
  script:
    - apk add --no-cache curl jq

    - |
      if [ ! -f .scannerwork/report-task.txt ]; then
        echo "No .scannerwork/report-task.txt found (scan failed or was skipped). Skipping export/push."
        exit 0
      fi

    - |
      INCLUDE_BRANCH="${SONAR_INCLUDE_BRANCH_PARAMS:-true}"
      if [ "$INCLUDE_BRANCH" = "true" ]; then
        BRANCH_NAME="${SONAR_BRANCH:-${CI_COMMIT_REF_NAME}}"
      else
        BRANCH_NAME=""
      fi

      CE_TASK_ID="$(grep -E '^ceTaskId=' .scannerwork/report-task.txt | cut -d= -f2)"
      echo "CE_TASK_ID=$CE_TASK_ID"; echo "BRANCH_NAME=$BRANCH_NAME"

      if [ -z "$CE_TASK_ID" ]; then
        echo "Missing ceTaskId in .scannerwork/report-task.txt"; exit 1
      fi

    - |
      for i in $(seq 1 60); do
        CE_JSON="$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/ce/task?id=$CE_TASK_ID")"
        STATUS="$(echo "$CE_JSON" | jq -r '.task.status')"
        ANALYSIS_ID="$(echo "$CE_JSON" | jq -r '.task.analysisId // empty')"
        echo "Sonar CE status: $STATUS"
        if [ "$STATUS" = "SUCCESS" ]; then break; fi
        if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELED" ]; then exit 1; fi
        sleep 5
      done

    - mkdir -p sonar-export

    - |
      QG_URL="$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY"
      if [ -n "$BRANCH_NAME" ]; then QG_URL="$QG_URL&branch=$BRANCH_NAME"; fi
      curl -s -u "$SONAR_TOKEN:" "$QG_URL" -o sonar-export/qualitygate.json

    - |
      MEASURES_URL="$SONAR_HOST_URL/api/measures/component?component=$SONAR_PROJECT_KEY"
      if [ -n "$BRANCH_NAME" ]; then MEASURES_URL="$MEASURES_URL&branch=$BRANCH_NAME"; fi
      # Build metricKeys dynamically to avoid "metric keys are not found" errors (varies by SonarQube version).
      DESIRED_KEYS="reliability_issues security_issues maintainability_issues bugs vulnerabilities code_smells security_hotspots accepted_issues coverage duplicated_lines_density ncloc reliability_rating security_rating sqale_rating new_bugs new_vulnerabilities new_code_smells new_security_hotspots new_coverage new_duplicated_lines_density new_lines new_lines_to_cover new_violations new_accepted_issues"
      # /api/metrics/search is paged; fetch all pages so we don't miss keys.
      AVAILABLE_KEYS=""
      FIRST_PAGE="$(curl -s -u \"$SONAR_TOKEN:\" \"$SONAR_HOST_URL/api/metrics/search?ps=500&p=1\" || true)"
      TOTAL="$(echo "$FIRST_PAGE" | jq -r '.paging.total // 0' 2>/dev/null || echo 0)"
      PS=500
      if [ -z "$TOTAL" ] || [ "$TOTAL" = "null" ]; then TOTAL=0; fi
      PAGES=$(( (TOTAL + PS - 1) / PS ))
      if [ "$PAGES" -lt 1 ]; then PAGES=1; fi
      for p in $(seq 1 "$PAGES"); do
        PAGE_JSON="$FIRST_PAGE"
        if [ "$p" -ne 1 ]; then
          PAGE_JSON="$(curl -s -u \"$SONAR_TOKEN:\" \"$SONAR_HOST_URL/api/metrics/search?ps=$PS&p=$p\" || true)"
        fi
        KEYS="$(echo "$PAGE_JSON" | jq -r '.metrics[].key' 2>/dev/null || true)"
        if [ -n "$KEYS" ]; then AVAILABLE_KEYS="$AVAILABLE_KEYS
      $KEYS"; fi
      done
      METRIC_KEYS=""
      for k in $DESIRED_KEYS; do
        if echo "$AVAILABLE_KEYS" | grep -qx "$k"; then
          if [ -z "$METRIC_KEYS" ]; then METRIC_KEYS="$k"; else METRIC_KEYS="$METRIC_KEYS,$k"; fi
        fi
      done
      if [ -z "$METRIC_KEYS" ]; then
        # Fallback to common metrics (should exist on all SonarQube versions)
        METRIC_KEYS="bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc"
      fi
      echo "Using metric keys: $METRIC_KEYS"
      MEASURES_URL="$MEASURES_URL&metricKeys=$METRIC_KEYS"
      curl -s -u "$SONAR_TOKEN:" "$MEASURES_URL" -o sonar-export/measures.json

    - |
      # Export open issue counts (matches SonarQube UI "Open issues" numbers more closely than some measures)
      ISSUES_URL="$SONAR_HOST_URL/api/issues/search?componentKeys=$SONAR_PROJECT_KEY&resolved=false&ps=1&facets=types"
      if [ -n "$BRANCH_NAME" ]; then ISSUES_URL="$ISSUES_URL&branch=$BRANCH_NAME"; fi
      curl -s -u "$SONAR_TOKEN:" "$ISSUES_URL" -o sonar-export/issues_facets.json || echo '{"facets":[]}' > sonar-export/issues_facets.json

    - |
      # Build a small normalized issueCounts JSON (bugs/vulnerabilities/codeSmells/securityHotspots)
      jq -n \
        --slurpfile issues sonar-export/issues_facets.json \
        'def countOf(t):
           ($issues[0].facets[]? | select(.property=="types") | .values[]? | select(.val==t) | .count) // 0;
         {
           bugs: countOf("BUG"),
           vulnerabilities: countOf("VULNERABILITY"),
           codeSmells: countOf("CODE_SMELL"),
           securityHotspots: (countOf("SECURITY_HOTSPOT"))
         }' > sonar-export/issueCounts.json \
      || echo '{"bugs":0,"vulnerabilities":0,"codeSmells":0,"securityHotspots":0}' > sonar-export/issueCounts.json

    - |
      NCP_URL="$SONAR_HOST_URL/api/new_code_periods/show?project=$SONAR_PROJECT_KEY"
      if [ -n "$BRANCH_NAME" ]; then NCP_URL="$NCP_URL&branch=$BRANCH_NAME"; fi
      curl -s -u "$SONAR_TOKEN:" "$NCP_URL" -o sonar-export/new_code_period.json

    - |
      jq -n \
        --arg mainproduct "$SONAR_MAINPRODUCT" \
        --arg subproduct "$SONAR_SUBPRODUCT" \
        --arg projectKey "$SONAR_PROJECT_KEY" \
        --arg branch "$BRANCH_NAME" \
        --arg scannedAt "$(date -Iseconds)" \
        --arg analysisId "${ANALYSIS_ID:-}" \
        --slurpfile qg sonar-export/qualitygate.json \
        --slurpfile measures sonar-export/measures.json \
        --slurpfile ncp sonar-export/new_code_period.json \
        --slurpfile issueCounts sonar-export/issueCounts.json \
        --slurpfile issues sonar-export/issues_facets.json \
        '{
          mainproduct: $mainproduct,
          subproduct: $subproduct,
          projectKey: $projectKey,
          branch: (if ($branch|length) > 0 then $branch else null end),
          scannedAt: $scannedAt,
          analysisId: (if ($analysisId|length) > 0 then $analysisId else null end),
          qualityGate: ($qg[0].projectStatus // $qg[0]),
          measures: ($measures[0].component.measures // $measures[0].component // $measures[0]),
          newCodePeriod: ($ncp[0].newCodePeriod // $ncp[0]),
          issueCounts: ($issueCounts[0] // null),
          raw: {
            qualityGate: $qg[0],
            measures: $measures[0],
            newCodePeriod: $ncp[0],
            issuesFacets: ($issues[0] // null)
          },
          metadata: {
            gitlab: {
              projectPath: env.CI_PROJECT_PATH,
              pipelineId: env.CI_PIPELINE_ID,
              jobId: env.CI_JOB_ID,
              commitSha: env.CI_COMMIT_SHA
            }
          }
        }' > sonar-export/payload.json

    - |
      if [ -n "$DASHBOARD_API_KEY" ]; then
        curl -s -X POST "$DASHBOARD_INGEST_URL" -H "Content-Type: application/json" -H "x-api-key: $DASHBOARD_API_KEY" --data @sonar-export/payload.json
      else
        curl -s -X POST "$DASHBOARD_INGEST_URL" -H "Content-Type: application/json" --data @sonar-export/payload.json
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - sonar-export/*.json
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

